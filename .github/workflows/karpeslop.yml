# Runs this checkout's KarpeSlop on its own source. The workflow for other
# projects to copy is examples/github-workflow.yml.
name: KarpeSlop Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  slop-check:
    name: KarpeSlop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Scan KarpeSlop's own source
        run: npx tsx ai-slop-detector.ts --strict ai-slop-detector.ts rules.ts imports.ts karpeslop-cli.js
